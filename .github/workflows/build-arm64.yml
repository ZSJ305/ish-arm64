name: Build ARM64 (mac)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-arm64-ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies (Apple deps)
        run: |
          brew install ninja lld llvm libarchive meson
          bundle install

      # ARM64 target 自带 "Build Meson (ARM64)" phase，会自动编：
      #   meson setup build-arm64-release -Dguest_arch=arm64 -Dengine=asbestos
      #   ninja -C build-arm64-release
      # 所以 xcodebuild 直接触发即可，无需手动 meson。
      # 注意：必须用 Debug-ApplePleaseFixFB19282108（=NotLinux/kernel=ish，编 libish.a 等 ARM64 引擎库），
      #       不能用 DebugLinux（=Linux.xcconfig，会把 ISH_KERNEL 设为 linux，需要 clone+build Linux 内核，CI 无法跑）。
      - name: Build ARM64 app (unsigned ipa ready)
        run: |
          xcodebuild -project iSH.xcodeproj \
                     -scheme iSH-ARM64 \
                     -configuration Debug-ApplePleaseFixFB19282108 \
                     -sdk iphoneos \
                     -arch arm64 \
                     -derivedDataPath $PWD/build \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Archive app bundle
        run: |
          APP="$PWD/build/Build/Products/Debug-ApplePleaseFixFB19282108-iphoneos/iSH ARM64.app"
          echo "app bundle: $APP"
          if [ ! -d "$APP" ]; then
            echo "!! 指定路径不存在，尝试搜索 build 目录中的 .app"
            APP=$(find "$PWD/build" -name "*.app" -type d | head -1)
            echo "fallback app bundle: $APP"
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::找不到 .app 产物"
            find "$PWD/build" -maxdepth 6 -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi
          rm -rf output Payload
          mkdir -p output Payload
          cp -R "$APP" Payload/
          cp -R "$APP" output/
          cd Payload && zip -r ../output/iSH-ARM64.ipa . && cd ..
          echo "=== output 内容 ==="
          ls -la output/
          echo "=== ipa 大小 ==="
          ls -la output/iSH-ARM64.ipa 2>/dev/null || du -sh output/*

      - uses: actions/upload-artifact@v4
        with:
          name: iSH-ARM64-app
          path: |
            output/iSH-ARM64.ipa
            output/iSH ARM64.app

      - name: Publish to GitHub Release
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0-${GITHUB_RUN_NUMBER}"
          # 幂等：若 tag 已存在（同 run 重跑）先删旧的 release+tag，避免冲突
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          fi
          # git tag 也要删（若存在），否则 gh release create 会失败
          git tag -d "$TAG" 2>/dev/null || true
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target HEAD \
            --title "iSH ARM64 build #${GITHUB_RUN_NUMBER}" \
            --notes "未签名构建（Debug-ApplePleaseFixFB19282108 / kernel=ish）。需用 Apple ID 签名后装 iPad。构建时间: $(date -u)" \
            "output/iSH-ARM64.ipa" \
            "output/iSH ARM64.app"
          echo "::notice::已发布 $TAG"
          echo "::notice::https://github.com/${{ github.repository }}/releases/tag/$TAG"
